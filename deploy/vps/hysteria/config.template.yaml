# Hysteria2 "gaming" server for AegisVPN. Provisioning fills __STATS_SECRET__
# into ./data/hysteria/config.yaml on the node; the real Let's Encrypt cert + key
# are installed separately (cert.pem/key.pem). Tuned for low CS2 jitter and
# reliability on mobile networks.
#
# - listen on UDP 443: it looks like HTTP/3 QUIC, which mobile networks carry. High
#   random UDP ports (36500 + a 20000-50000 hop range) + salamander obfs made the
#   traffic NOT look like QUIC and got it dropped on mobile — so both are gone
#   (no obfs, no port hopping; single :443).
# - BBR congestion (hysteria's default when NO `bandwidth` is set): it adapts to
#   the path and keeps the queue minimal -> low, stable ping. Brutal forced a
#   fixed rate and bufferbloated -> high CS hit-reg latency; removed.
# - Per-user auth + traffic stats go through the aegis-vpn agent on loopback, so
#   the bot lifecycle (add/remove/expiry/block/conn-limit) drives Hy2 like xray.
#   The user's xray UUID is the Hy2 auth secret.

listen: :443

# Small QUIC receive windows (4 MB stream / 10 MB conn) cap how much data sits in
# flight, so on a lossy/UDP-policed RU path (where the client's upstream drops ~2%
# and QUIC has to retransmit) the buffer — and the worst-case latency spike a CS2
# hit-reg sees — stays small. Bigger windows trade latency for throughput, which
# games don't need. maxIdleTimeout/keepAlive keep the tunnel warm across NAT.
quic:
  initStreamReceiveWindow: 4194304
  maxStreamReceiveWindow: 4194304
  initConnReceiveWindow: 10485760
  maxConnReceiveWindow: 10485760
  maxIdleTimeout: 30s
  keepAlivePeriod: 10s
  # Some filtered/mobile paths pass the small QUIC handshake packets but black-hole
  # larger packets selected by DPLPMTUD. Keep quic-go on its conservative base MTU
  # so HY2 data streams work across those paths, at a small throughput cost.
  disablePathMTUDiscovery: true

tls:
  cert: /etc/hysteria/current/cert.pem
  key: /etc/hysteria/current/key.pem

auth:
  type: http
  http:
    url: http://127.0.0.1:8444/hy2/auth

trafficStats:
  listen: 127.0.0.1:9999
  secret: __STATS_SECRET__

masquerade:        # a raw (non-Hy2) probe to :443 gets a plain 404
  type: 404
