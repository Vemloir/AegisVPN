x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  # Data plane: runs ONLY xray against the shared config that the agent owns.
  # Kept separate so agent code deploys (which recreate `agent`) never restart
  # xray — existing client sessions survive a code update untouched.
  xray:
    build:
      context: ../../agent
    container_name: aegis-xray
    restart: unless-stopped
    env_file:
      - ./vpn.env
    environment:
      - XRAY_RUN_MODE=xray-only
    network_mode: host
    logging: *default-logging
    volumes:
      - ./data/vpn:/data

  # Control plane: builds the xray config from agent.env and serves the agent
  # API. Shares xray's PID namespace so `xray api` / `pkill xray` reach the data
  # plane. Restarting this container does NOT touch xray (zero-drop deploys).
  agent:
    build:
      context: ../../agent
    container_name: aegis-vpn
    restart: unless-stopped
    env_file:
      - ./vpn.env
    environment:
      - XRAY_RUN_MODE=agent-only
    network_mode: host
    pid: "service:xray"
    depends_on:
      - xray
    logging: *default-logging
    volumes:
      - ./data/vpn:/data

  bot:
    build:
      context: ../../bot
      dockerfile: Dockerfile.deploy
    container_name: aegis-bot
    restart: unless-stopped
    env_file:
      - ./bot.env
    network_mode: host
    logging: *default-logging
    volumes:
      - ./data/bot:/data
      - ./data/vpn:/vpn-data:ro

  # Public website API (FastAPI, src.api.main:app). Reuses the bot image (same
  # deps + code), reads the SAME sqlite as the bot so the site can never disagree
  # with what the bot sells (plans/prices/locations). Loopback-only; Caddy on the
  # host proxies aegisvpn.org/api/* here. Control-host only, like the bot.
  siteapi:
    build:
      context: ../../bot
      dockerfile: Dockerfile.deploy
    container_name: aegis-siteapi
    restart: unless-stopped
    env_file:
      - ./bot.env
    network_mode: host
    command: ["python", "-m", "uvicorn", "src.api.main:app", "--host", "127.0.0.1", "--port", "8000"]
    logging: *default-logging
    volumes:
      - ./data/bot:/data

  # Support bot (@AegisVPNsupportBot): two-way user<->operator relay used as the
  # official feedback channel. Long-polling (no inbound port). Token + operator
  # IDs come from ./support.env (never in the repo). Separate Telegram bot, so it
  # runs independently of the main bot lifecycle.
  support-bot:
    build:
      context: ../../support_bot
    container_name: aegis-support-bot
    restart: unless-stopped
    env_file:
      - ./support.env
    logging: *default-logging
    volumes:
      - ./data/support:/data
      # Main bot's sqlite, READ-ONLY — initial UI language per user.
      - ./data/bot:/main-data:ro

  mtg:
    image: ghcr.io/9seconds/mtg:2
    container_name: aegis-mtg
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    profiles:
      - mtproxy

  caddy:
    image: caddy:2
    container_name: aegis-caddy
    restart: unless-stopped
    network_mode: host
    logging: *default-logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./config/caddy:/config
      # Built website SPA (web/dist), served for aegisvpn.org. Only present on
      # the control host; nodes don't run caddy so the missing dir is harmless.
      - ./web:/srv/web:ro

  # Hysteria2 "gaming" data plane — opt-in via the `hysteria` profile, so nodes
  # without it run nothing extra. apernet/hysteria on its own UDP port; per-user
  # auth/kick/stats go through the agent on loopback (host net), so the bot
  # lifecycle drives it like xray. Config + self-signed cert + secrets are
  # generated per node into ./data/hysteria/ (never in the repo).
  hysteria:
    # tobyxdd/hysteria:latest is the verified Hysteria v2 image. The previously
    # used ghcr.io/apernet/hysteria:latest 403s on pull from these nodes.
    image: tobyxdd/hysteria:latest
    container_name: aegis-hysteria
    restart: unless-stopped
    network_mode: host
    command: ["server", "-c", "/etc/hysteria/config.yaml"]
    volumes:
      - ./data/hysteria:/etc/hysteria
    logging: *default-logging
    profiles:
      - hysteria
