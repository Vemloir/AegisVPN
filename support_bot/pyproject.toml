[project]
name = "aegis-support-bot"
version = "0.1.0"
description = "AegisVPN support bot — relays user messages to operators and operator replies back"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.17.0",
    "pydantic-settings>=2.8.0",
    "pydantic>=2.10.6",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
