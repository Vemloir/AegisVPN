<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- The page ships its own light/dark themes. Without this, Dark Reader
         inverts them a second time and the dark theme comes back out light.
         `darkreader-lock` is the extension's supported opt-out; `color-scheme`
         tells the browser to theme scrollbars and form controls to match. -->
    <meta name="darkreader-lock" />
    <meta name="color-scheme" content="light dark" />

    <title>AegisVPN — быстрый и приватный VPN</title>
    <meta name="description" content="Быстрый приватный VPN на VLESS Reality: одна подписка для всех локаций." />
    <link rel="canonical" href="https://aegisvpn.org/ru/" />
    <link rel="alternate" hreflang="ru" href="https://aegisvpn.org/ru/" />
    <link rel="alternate" hreflang="en" href="https://aegisvpn.org/en/" />
    <link rel="alternate" hreflang="x-default" href="https://aegisvpn.org/ru/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Warm the Telegram login widget up front: its script and iframe come
         from telegram.org / oauth.telegram.org, and fetching them only when the
         auth modal opens left the login button blank for a beat. Preconnect +
         preload so it renders as soon as the modal appears. -->
    <link rel="preconnect" href="https://telegram.org" />
    <link rel="preconnect" href="https://oauth.telegram.org" />
    <link rel="preload" as="script" href="https://telegram.org/js/telegram-widget.js?22" />

    <!-- Telegram Mini App SDK: exposes window.Telegram.WebApp with the signed
         initData when the site is opened inside Telegram, enabling silent
         sign-in. async so it never blocks a plain-browser load (where
         telegram.org may be unreachable and there's no Mini App anyway). -->
    <script async src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
