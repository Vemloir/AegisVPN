[project]
name = "aegis-vpn-agent"
version = "0.1.0"
description = "Aegis VPN Node Agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.8.0",
    "pydantic>=2.10.6",
    "aiofiles>=23.2.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
