name: CI

on:
  # Auto-triggers (push / pull_request) are disabled because GitHub Actions is
  # locked on this account pending billing. The pipeline is kept ready and can
  # be run manually from the Actions tab; re-enable the triggers below once
  # billing is active. Checks also run locally: `uv run ruff check .` and
  # `uv run pytest` in bot/ and agent/.
  workflow_dispatch:

jobs:
  lint-test:
    name: lint & test (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [bot, agent]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  docker-build:
    name: docker build (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [bot, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          file: ${{ matrix.component }}/Dockerfile
          push: false
