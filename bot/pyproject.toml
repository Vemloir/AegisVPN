[project]
name = "aegis-vpn-bot"
version = "0.1.0"
description = "Aegis VPN Telegram Bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.17.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.1",
    "apscheduler>=3.11.0",
    "pydantic-settings>=2.8.0",
    "pydantic>=2.10.6",
    "tenacity>=9.0.0",
    "aiohttp>=3.11.13",
    "cryptography>=45.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
