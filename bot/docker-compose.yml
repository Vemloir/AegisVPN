# Local development stack (bot + PostgreSQL).
#
# Production runs from deploy/vps/docker-compose.yml, where Caddy terminates
# HTTPS for the subscription endpoint. See deploy/vps/README.md.
services:
  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_NAME=aegis
      - WEBAPP_HOST=0.0.0.0
      - WEBAPP_PORT=8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
